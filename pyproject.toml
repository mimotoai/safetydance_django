[project]
name = "safetydance-django"
version = "0.1.0"
description = "safetydance steps for BDD testing of Django REST Framework applications."
authors = [{ name = "David Charboneau", email = "david@adadabase.com" }]
license = "MIT"
license-files = ["LICENSE.txt", "AUTHORS.rst"]
readme = "README.rst"
requires-python = ">=3.10"
dependencies = ["safetydance>=0.5,<0.6", "django>=4.2", "djangorestframework>=3.15"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: Django",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Testing :: BDD",
]

[project.urls]
Documentation = "https://dcharbon.gitlab.io/safetydance_django"
Repository = "https://gitlab.com/dcharbon/safetydance_django.git"

[dependency-groups]
test = ["pytest>=8.3.5,<10", "pytest-cov>=6.1.0,<7", "pytest-django>=4.9", "packaging>=24"]
docs = ["sphinx>=8"]
dev = [{ include-group = "test" }, { include-group = "docs" }]

[build-system]
requires = ["uv_build>=0.9.0,<0.10.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["safetydance_django"]
branch = true

[tool.coverage.report]
show_missing = true
